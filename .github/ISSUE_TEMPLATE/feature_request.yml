name: 功能建议
description: 提出适合星桥的功能或体验改进。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "请先搜索已有 Issues 和讨论，避免重复。"
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述玩家场景，而不只描述某个实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: 关联游戏
      options:
        - 四款游戏共通
        - 原神
        - 崩坏：星穹铁道
        - 绝区零
        - 崩坏 3
        - 不关联游戏
